<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Courses</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <header class="app-header">
        <div class="logo">SELECT COURSES</div>
        <div class="menu">☰</div>
    </header>

    <main class="content">

        <h1>Select Courses</h1>
        <p>Choose one or more courses.</p>

        <div class="selection-item">
            <input type="checkbox" id="obedience">
            <label for="obedience">Canine Obedience - R850</label>
        </div>

        <div class="selection-item">
            <input type="checkbox" id="grooming">
            <label for="grooming">Pet Grooming - R700</label>
        </div>

        <div class="selection-item">
            <input type="checkbox" id="puppy">
            <label for="puppy">Puppy Care - R650</label>
        </div>

        <a class="button" href="07-my-selection.html">Continue</a>

    </main>

</div>

</body>
</html>
