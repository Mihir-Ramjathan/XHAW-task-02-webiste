<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Fees</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <header class="app-header">
        <div class="logo">CALCULATE FEES</div>
        <div class="menu">☰</div>
    </header>

    <main class="content">

        <h1>Fee Summary</h1>

        <div class="card">

            <div class="summary-row">
                <span>Courses</span>
                <span>3</span>
            </div>

            <div class="summary-row">
                <span>Subtotal</span>
                <span>R2200</span>
            </div>

            <div class="summary-row">
                <span>Discount</span>
                <span>10%</span>
            </div>

            <div class="summary-row">
                <span>Discount Amount</span>
                <span>R220</span>
            </div>

            <div class="summary-row">
                <span>VAT</span>
                <span>15%</span>
            </div>

            <div class="summary-row">
                <span>VAT Amount</span>
                <span>R297</span>
            </div>

            <div class="total-row">
                <span>Total</span>
                <span>R2277</span>
            </div>

        </div>

        <a class="button" href="09-request-quote.html">Request Quote</a>

    </main>

</div>

</html>
