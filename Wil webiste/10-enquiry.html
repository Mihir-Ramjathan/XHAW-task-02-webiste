<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <header class="app-header">
        <div class="logo">ENQUIRY</div>
        <div class="menu">☰</div>
    </header>

    <main class="content">

        <h1>Send an Enquiry</h1>

        <form>

            <div class="form-group">
                <label for="enquiry-name">Full Name</label>
                <input type="text" id="enquiry-name">
            </div>

            <div class="form-group">
                <label for="enquiry-email">Email Address</label>
                <input type="email" id="enquiry-email">
            </div>

            <div class="form-group">
                <label for="enquiry-type">Enquiry Type</label>
                <select id="enquiry-type">
                    <option>Course Information</option>
                    <option>Prices</option>
                    <option>General Enquiry</option>
                </select>
            </div>

            <div class="form-group">
                <label for="enquiry-message">Your Enquiry</label>
                <textarea id="enquiry-message"></textarea>
            </div>

            <a class="button" href="12-confirmation.html">Send Enquiry</a>

        </form>

    </main>

</div>

</body>
</html>
